<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeUchi Township</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="MeUchi: community safety and township care for Taman Seri Harmoni.">
<style>
/* Layout: MeUchi shell (green sidebar + main workspace). Resident pages and management pages share one live state. Single light theme by design. */
:root{--navy:#173b35;--green:#247b5b;--mint:#e8f5ed;--lime:#d9f16a;--ink:#182824;--muted:#6b7b75;--line:#e4ebe6;--bg:#f5f8f5;--orange:#f4a340;--red:#d95151;--white:#fff;
  --crit:#c42525;--high:#cf5a0c;--mod:#a67c00;--low:#3c8655;--ok:#1f7d49;--rescue:#1c43b0;--evac:#13845a;--blue:#1f74c4;
  --ground:#e1e8e0;--road:#ffffff;--road-edge:#b9c5c0;--bldg:#cbd6d0;--bldg-line:#90a19a;--park:#bfdabd;--water:#8dbcda;--water-line:#5b95bd;
  --flood-fill:rgba(28,110,200,.20);--flood-line:rgba(28,110,200,.55);--fire-fill:rgba(214,70,28,.17);--fire-line:rgba(214,70,28,.6);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
.mono{font-family:var(--mono);font-size:12px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:25px 17px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.logo-full{display:none}.brand b{font-size:21px;letter-spacing:-.7px}.brand small{display:block;color:#b9d4c7;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}.logo-icon{display:block;width:42px;height:42px;border-radius:12px;background:#fff;object-fit:cover;flex:none}.logo{width:40px;height:40px;border-radius:14px;background:var(--lime);display:grid;place-items:center;color:var(--navy);font-weight:900;font-size:21px}.brand b{font-size:21px;letter-spacing:-.7px}.brand small{display:block;color:#b9d4c7;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.nav-label{font-size:10px;letter-spacing:1.5px;color:#8fb6a4;padding:0 12px;margin:14px 0 6px}.navs>.nav-label:first-child{margin-top:0}
.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;background:transparent;color:#d7e6df;text-align:left;padding:11px 12px;border-radius:12px;width:100%}.nav button.active,.nav button:hover{background:#2c554a;color:#fff}.nav .ico{width:22px;text-align:center;font-size:17px}
.nav .nb{margin-left:auto;background:var(--lime);color:var(--navy);border-radius:20px;font-size:10px;font-weight:800;padding:2px 7px}
.nav .nb.red{background:#ff8a7a;color:#4a0f0f}
.side-bottom{margin-top:auto;background:#254b40;border:1px solid #3d6658;border-radius:16px;padding:15px}.side-bottom strong{display:block;font-size:13px;margin:7px 0 4px}.side-bottom p{font-size:12px;color:#c3d9ce;margin:0 0 12px}.side-bottom button{background:var(--lime);color:var(--navy);font-weight:750;border-radius:9px;padding:9px 11px;width:100%}
main{padding:28px clamp(18px,3vw,42px);min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800}.topbar h1{font-size:27px;letter-spacing:-1px;margin:4px 0 0}
.top-actions{display:flex;align-items:center;gap:10px}.search{background:white;border:1px solid var(--line);padding:10px 13px;border-radius:12px;min-width:200px}.iconbtn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;position:relative}.iconbtn .dotn{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:1px 6px}
.avatar{width:38px;height:38px;border-radius:50%;background:#d8eee0;color:var(--green);display:grid;place-items:center;font-weight:800;flex:none}
.avatar.mgmt{background:var(--navy);color:var(--lime)}
.banner{background:linear-gradient(110deg,#1c4c40,#27795b);color:white;border-radius:20px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;overflow:hidden;position:relative}.banner:after{content:"";position:absolute;width:210px;height:210px;border:35px solid #ffffff0e;border-radius:50%;right:15%;top:-100px}.banner h2{font-size:21px;margin:5px 0}.banner p{margin:0;color:#d4e9df;font-size:13px}.banner button{position:relative;z-index:1;background:var(--lime);color:var(--navy);font-weight:800;padding:12px 16px;border-radius:12px;white-space:nowrap}
.banner.alert{background:linear-gradient(110deg,#7a1f1f,#b33a2e)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.stat,.panel,.issue{background:#fff;border:1px solid var(--line);border-radius:17px}.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;display:grid;place-items:center;background:var(--mint);border-radius:11px;font-size:17px}.stat h3{font-size:27px;letter-spacing:-1px;margin:12px 0 1px;font-variant-numeric:tabular-nums}.stat small{color:var(--muted);font-size:11px}.green{color:var(--green)!important}.orange{color:#bb741a!important}.red{color:var(--red)!important}
.content-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.85fr);gap:18px}.panel{padding:20px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.panel-head h2{font-size:16px;margin:0}.panel-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.textbtn{color:var(--green);background:transparent;font-weight:750;font-size:12px}
.issue-list{display:grid;gap:10px}.issue{padding:13px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}.issue.click{cursor:pointer}.issue.click:hover{border-color:#bcd9c7}
.issue-symbol{width:39px;height:39px;border-radius:12px;background:#fff0e8;display:grid;place-items:center;font-size:19px;flex-shrink:0}.issue-main{min-width:0;flex:1}.issue-main strong{font-size:13px;display:block}.issue-main p{font-size:11px;color:var(--muted);margin:4px 0}.issue-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:800;background:#fff0ef;color:var(--red);letter-spacing:.3px;white-space:nowrap}.tag.critical{background:#fde4e4;color:var(--crit)}.tag.high{background:#fff0e3;color:var(--high)}.tag.medium,.tag.medtag{background:#fff4df;color:#a56b16}.tag.low,.tag.lowtag{background:#e8f5ed;color:var(--green)}
.tag.s-new{background:#e6eefb;color:#2d5ea8}.tag.s-assigned{background:#fff4df;color:#a56b16}.tag.s-progress{background:#fff0e3;color:var(--high)}.tag.s-resolved{background:#e8f5ed;color:var(--green)}.tag.grey{background:#eef2ef;color:var(--muted)}
.reports{font-size:10px;color:var(--muted)}
.ai-card{background:#eff8f0;border:1px solid #d7eadb;border-radius:14px;padding:15px;margin-top:14px}.ai-title{font-size:12px;font-weight:850;color:var(--green);display:flex;gap:7px;align-items:center}.ai-card p{font-size:12px;margin:8px 0;color:#41584c}.ai-card button{background:#fff;border:1px solid #d2e5d7;color:var(--green);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:750}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.alert-card{display:flex;gap:12px;align-items:flex-start}.alert-icon{background:#fff0ef;color:var(--red);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}.alert-icon.blue{background:#e6eefb}.alert-card strong{font-size:13px}.alert-card p{font-size:12px;color:var(--muted);margin:4px 0 9px}.alert-card .acts button{background:#fff0ef;color:var(--red);font-weight:800;border-radius:9px;padding:8px 10px;font-size:11px}
.alert-card.fresh{border:1.5px solid var(--red);background:#fffafa}
.volunteer{display:flex;justify-content:space-between;gap:12px;align-items:center}.points{font-size:24px;font-weight:850;color:var(--green);font-variant-numeric:tabular-nums}.points small{display:block;color:var(--muted);font-size:10px;font-weight:500}.progress{height:7px;border-radius:10px;background:#e8eee9;margin:12px 0 8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .4s}.smallmuted{font-size:11px;color:var(--muted)}
.section-title{font-size:21px;margin:0 0 6px}.section-desc{color:var(--muted);margin:0 0 20px;font-size:13px;max-width:75ch}
.management-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.management-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}.management-card h3{font-size:15px;margin:0}.management-card p{color:var(--muted);font-size:12px;margin:0}.management-card button{background:var(--green);color:white;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:750;margin-top:4px}
.management-card.locked{background:#f8faf8;border-style:dashed}.management-card.locked h3,.management-card.locked p{color:#93a39a}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;align-content:start}.field.full{grid-column:1/-1}.field label,.flabel{font-size:12px;font-weight:750}.field input,.field textarea,.field select{border:1px solid #dce6de;border-radius:10px;padding:11px;background:#fbfdfb;width:100%;outline-color:var(--green)}.field textarea{min-height:90px;resize:vertical}
.upload{border:1.5px dashed #bfd4c4;border-radius:12px;padding:18px;text-align:center;background:#f8fcf8;color:var(--muted);font-size:12px;cursor:pointer;display:block}.upload b{color:var(--ink)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:17px;flex-wrap:wrap;align-items:center}
.primary{background:var(--green);color:white;border-radius:10px;padding:11px 16px;font-weight:800}.secondary{background:#edf4ee;color:var(--green);border-radius:10px;padding:11px 16px;font-weight:750}.danger{background:var(--red);color:#fff;border-radius:10px;padding:11px 16px;font-weight:800}.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;color:var(--ink)}
.sm{padding:7px 11px!important;font-size:12px!important;border-radius:9px!important}
button:disabled{opacity:.45;cursor:not-allowed}
.notice{background:#fff6df;border:1px solid #f3dfaa;color:#765419;border-radius:12px;padding:12px;font-size:12px;margin:0 0 12px}
.success{background:#e8f7eb;border:1px solid #c8e7d0;color:#226441;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.errbox{background:#fff0ef;border:1.5px solid var(--red);color:#7d2727;border-radius:12px;padding:13px;font-size:12.5px}
.errbox b.h{display:block;font-size:15px;color:var(--red);margin-bottom:4px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.badge{display:inline-flex;align-items:center;gap:5px;background:#f2f6cf;color:#596319;padding:5px 9px;border-radius:30px;font-size:10px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:650}.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.dash{border-style:dashed;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
footer.foot{text-align:center;color:#94a39a;font-size:10px;padding:25px 0 5px}

/* photos */
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:#222;max-width:100%}
.photo svg,.photo img,.th svg,.th img{width:100%;height:100%;display:block;object-fit:cover}
.photo.scan::after{content:"";position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(to bottom,transparent,rgba(217,241,106,.55),transparent);animation:scan 1.1s linear infinite}
@keyframes scan{to{top:100%}}
.photo.flagged{outline:3px solid var(--red);outline-offset:-3px}
.ph-tag{position:absolute;left:10px;bottom:10px;background:rgba(23,59,53,.85);color:#fff;font-size:11px;font-weight:750;padding:5px 9px;border-radius:999px}
.ph-tag.bad{background:var(--red)}
.th{width:44px;height:44px;border-radius:9px;overflow:hidden;flex:none;background:#ddd}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.sample{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;padding:0;font-size:11px;font-weight:650;text-align:center}
.sample .th{width:100%;height:auto;aspect-ratio:1;border-radius:0}
.sample span{display:block;padding:4px 2px 5px}.sample.bad span{color:var(--red)}
.photo-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.conf{height:6px;border-radius:6px;background:#dfeae2;overflow:hidden;margin:6px 0 4px}.conf i{display:block;height:100%;background:var(--green)}

/* map (from Anis) */
.mapbox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--ground)}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox.picking svg{cursor:crosshair}
.map-pill{position:absolute;left:12px;top:12px;background:#ffffffed;border:1px solid #dfe9df;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:750;pointer-events:none}
.maphint{padding:9px 2px 0;font-size:12px;color:var(--muted)}.maphint b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.m-ground{fill:var(--ground)}.m-water{fill:var(--water)}.m-drain{stroke:var(--water-line);stroke-width:4;fill:none;stroke-linecap:round}
.m-road-edge{stroke:var(--road-edge);stroke-width:26;stroke-linecap:round}.m-road{stroke:var(--road);stroke-width:22;stroke-linecap:round}
.m-road-lbl{fill:var(--muted);font:600 9.5px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.m-bldg{fill:var(--bldg);stroke:var(--bldg-line);stroke-width:1}.m-bldg.park{fill:var(--park)}.m-bldg.home{fill:#d6ecdf;stroke:var(--green);stroke-width:1.5}.m-pond{fill:var(--water)}
.m-lbl{fill:var(--ink);font:650 11px Inter,system-ui,sans-serif}.m-lbl-sub{fill:var(--muted);font:400 9.5px Inter,system-ui,sans-serif}
.m-gate{fill:var(--muted);font:700 10px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.m-zone-flood{fill:url(#hatchFlood);stroke:var(--flood-line);stroke-width:2}.m-zone-fire{fill:url(#hatchFire);stroke:var(--fire-line);stroke-width:2}.m-zone-block{fill:var(--fire-fill);stroke:var(--crit);stroke-width:2;stroke-dasharray:4 3}
.h-flood-bg{fill:var(--flood-fill)}.h-flood-ln{stroke:var(--flood-line);stroke-width:1.5}.h-fire-bg{fill:var(--fire-fill)}.h-fire-ln{stroke:var(--fire-line);stroke-width:1.5}
.m-cut{stroke:var(--crit);stroke-width:5;stroke-dasharray:6 5;stroke-linecap:round;opacity:.9}.m-x{stroke:var(--crit);stroke-width:3.5;stroke-linecap:round}.m-x-bg{fill:#fff;stroke:var(--crit);stroke-width:2}
.m-aff{fill:none;stroke-width:3}.m-relief{fill:none;stroke:var(--evac);stroke-width:3;stroke-dasharray:2 3}
.m-tag-bg{fill:#fff}.m-tag{font:700 10px var(--mono)}
.route{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 7;animation:dash 1s linear infinite}.route.rescue{stroke:var(--rescue)}.route.evac{stroke:var(--evac)}
.route-end{stroke:#fff;stroke-width:2}.route-end.rescue{fill:var(--rescue)}.route-end.evac{fill:var(--evac)}
@keyframes dash{to{stroke-dashoffset:-19}}
.halo{stroke-width:2;stroke-dasharray:5 4;cursor:pointer}.halo.sel{stroke-width:3;stroke-dasharray:none}
.pin{cursor:pointer}.pin circle.dot{stroke:#fff;stroke-width:2}.pin.sel circle.dot{stroke:var(--ink);stroke-width:2.5}.pin.done{opacity:.4}
.pin.pop circle.dot{transform-box:fill-box;transform-origin:center;animation:pop .55s ease-out}
@keyframes pop{0%{transform:scale(0)}65%{transform:scale(1.5)}100%{transform:scale(1)}}
.pending circle{fill:none;stroke:var(--green);stroke-width:3}.pending line{stroke:var(--green);stroke-width:2.5}
.me-dot{fill:#2d68a8;stroke:#fff;stroke-width:2}.me-ring{fill:#2d68a8;opacity:.18}
.sev-critical{--sev:var(--crit)}.sev-high{--sev:var(--high)}.sev-medium{--sev:var(--mod)}.sev-low{--sev:var(--low)}
.map-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.map-grid .mapcol{position:sticky;top:16px}
.tabs{display:flex;gap:4px;background:#eef3ef;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:750;font-size:13px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px #0001}
.inc{border:1px solid var(--line);border-left:5px solid var(--sev);border-radius:12px;background:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.inc.sel{box-shadow:0 0 0 2px var(--sev)}
.inc-head{display:flex;flex-direction:column;gap:3px;text-align:left}
.inc h3{font-size:15px;margin:0}
.meta{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:center;gap:10px}.bar{flex:1;height:8px;border-radius:99px;background:#eef3ef;overflow:hidden}.bar i{display:block;height:100%;background:var(--sev);border-radius:99px}
.score .mono{font-size:13px;font-weight:700;min-width:52px;text-align:right}
.factors{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}.factors li{display:flex;gap:8px}.factors .mono{color:var(--sev);min-width:28px;font-weight:700}
details summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--green)}
.rlist{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12px}.rlist li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:6px 8px;background:#f4f7f5;border-radius:6px}.rlist .mono{color:var(--muted);font-size:11px}
.emerg{border-radius:12px;padding:12px 14px;background:var(--crit);color:#fff;display:flex;flex-direction:column;gap:2px}.emerg h3{font-size:17px;margin:0}.emerg p{font-size:12.5px;opacity:.9;margin:0}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mstats div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#f8faf8}.mstats b{display:block;font-family:var(--mono);font-size:20px}.mstats span{font-size:11px;color:var(--muted)}
.prio{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.prio li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 10px;border:1px solid var(--line);border-left:4px solid var(--sev);border-radius:8px;font-size:12.5px}.prio .rank{font-family:var(--mono);color:var(--muted)}.prio p{margin:0;color:var(--muted);font-size:12px}.prio .act{color:var(--ink)}.prio .ppl{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.rt{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}.rt i{width:14px;height:5px;border-radius:3px;margin-top:7px}.rt i.rescue{background:var(--rescue)}.rt i.evac{background:var(--evac)}.rt p{margin:0;color:var(--muted)}.rt .mono{text-align:right;white-space:nowrap}
.scen{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;width:100%}.scen:hover{border-color:var(--green)}.scen b{font-size:14px}.scen span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{padding:7px 13px;font-size:12.5px;font-weight:650;border-right:1px solid var(--line);background:#fff}.seg button:last-child{border-right:0}.seg button.on{background:var(--green);color:#fff}
.stack{display:flex;flex-direction:column;gap:10px}
.sh{font-size:13px;font-weight:800;margin:6px 0 0}.sh small{font-weight:400;color:var(--muted)}

/* scam check (from Anis) */
.verdict{display:flex;justify-content:space-between;gap:14px;align-items:center;border-radius:12px;padding:13px 15px;border:1.5px solid var(--vc);background:#fff}
.verdict strong{display:block;font-size:19px;color:var(--vc)}.verdict p{font-size:12px;color:var(--muted);margin:2px 0 0}
.v-scam{--vc:var(--crit)}.v-sus{--vc:var(--high)}.v-ok{--vc:var(--ok)}.v-none{--vc:var(--muted)}
.risk{text-align:right;flex:none}.risk b{display:block;font-family:var(--mono);font-size:28px;color:var(--vc);line-height:1}.risk span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.msgbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff}
mark{background:none;color:inherit;border-bottom:2px solid var(--mc);padding:0 1px;box-shadow:inset 0 -0.55em 0 color-mix(in srgb,var(--mc) 18%,transparent)}mark.crit{--mc:var(--crit)}mark.high{--mc:var(--high)}mark.okm{--mc:var(--ok)}
.evidence{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}.evidence li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;font-size:12.5px}.evidence .pts{font-family:var(--mono);font-weight:700;color:var(--crit)}.evidence .pts.okp{color:var(--ok)}.evidence p{margin:2px 0 0;color:var(--muted)}
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}.cmp th,.cmp td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}.cmp tr:last-child td{border-bottom:0}.cmp th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#f4f7f5}.cmp .bad{color:var(--crit)}.cmp .good{color:var(--ok)}
.reg{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;background:#f8faf8}.reg .mono{color:var(--green)}.reg b{display:block}
.bubble-msg{background:#DCF8C6;color:#1b2b1f;border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:13px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12)}

/* problems log (from index) */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:17px}
table.log{width:100%;border-collapse:collapse;font-size:13px}
.log th{text-align:left;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.log td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.log tr:last-child td{border-bottom:0}
.log tr.click{cursor:pointer}.log tr.click:hover td{background:#f6faf7}
.log td .cell{display:flex;gap:10px;align-items:center}
.num{font-variant-numeric:tabular-nums;font-weight:800}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,30,26,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:#fff;box-shadow:-16px 0 40px rgba(0,0,0,.16);transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:41}
.drawer.open{transform:none}
.dr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px 18px;border-bottom:1px solid var(--line);padding-top:max(14px,env(safe-area-inset-top,0px))}
.dr-head .row{gap:6px}
.dr-body{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 28px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.dr-title{font-size:21px;margin:0;letter-spacing:-.5px}
.ai{background:#eff8f0;border:1.5px solid #9fd0b0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:11px}
.ai.pop{animation:aipop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes aipop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.ai-sec b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--green);margin-bottom:2px}.ai-sec p{font-size:13px;margin:0}
.contact{display:flex;flex-direction:column;gap:12px;background:#fff;border-radius:12px;padding:12px;border:1px solid #d7eadb}.c-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.estimate{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}.estimate>div{border-radius:10px;padding:10px 12px;background:#f4f8f5;display:flex;flex-direction:column;gap:2px}.estimate .cost{background:#fff8e6;border:1px solid #f3dfaa}.estimate small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.estimate b{font-size:19px;font-variant-numeric:tabular-nums;color:var(--ink)}.estimate .cost b{color:#8a5a00}.est-note{font-size:11.5px;color:var(--muted);margin:0}
.c-top>div{display:flex;flex-direction:column;gap:1px;min-width:0}.contact small{font-size:11px;color:var(--muted)}.contact .mono{font-size:13px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ba figure{margin:0;display:flex;flex-direction:column;gap:4px}.ba .photo{aspect-ratio:1}.ba figcaption{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.dh4{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 0}
.sub{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:8px}.sub:last-child{border-bottom:0}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px}.tl li{display:flex;gap:10px}.tl time{color:var(--muted);font-size:11.5px;min-width:118px;font-variant-numeric:tabular-nums}

/* volunteer applications */
.tracker{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tracker li{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tracker li i{height:6px;border-radius:6px;background:#e3eae5}
.tracker li.done i{background:var(--green)}.tracker li.now i{background:var(--orange)}.tracker li.bad i{background:var(--red)}
.tracker li.done,.tracker li.now{color:var(--ink);font-weight:700}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.doc .th{width:48px;height:48px}
.doc b{font-size:13px}.doc small{display:block;color:var(--muted);font-size:11.5px}
.doc.missing{border-style:dashed;background:#fbfcfb}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.req{color:var(--red);font-weight:800}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 14px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px}
.checks input,.decl input{width:16px;height:16px;accent-color:var(--green)}
.decl{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;background:#f4f8f5;border-radius:12px;padding:12px}
.ok-line{color:var(--ok);font-weight:750;font-size:12.5px}
.bad-line{color:var(--red);font-weight:750;font-size:12.5px}
.vol-hero{background:linear-gradient(110deg,#173b35,#247b5b);color:#fff;border-radius:20px;padding:22px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.vol-hero h2{margin:4px 0;font-size:21px}.vol-hero p{margin:0;color:#d4e9df;font-size:13px}
.vol-hero button{background:var(--lime);color:var(--navy);font-weight:800;padding:12px 16px;border-radius:12px}
.task{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.task-top{display:flex;gap:10px;align-items:center}
.person{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff4df;color:#a56b16;flex:none}

.toasts{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(400px,calc(100% - 32px))}
.toast{background:#173b35;color:white;padding:12px 15px;border-radius:12px;box-shadow:0 10px 35px #0003;font-size:13px;display:flex;gap:10px;align-items:center;animation:rise .25s ease-out}
.toast.red{background:#9b2c2c}.toast.gold{background:#8a6d1f}
.toast button{margin-left:auto;background:var(--lime);color:var(--navy);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800;white-space:nowrap}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px;background:#fff}

@media(max-width:1180px){.map-grid{grid-template-columns:minmax(0,1fr)}.map-grid .mapcol{position:static}}
@media(max-width:1050px){.app{grid-template-columns:210px minmax(0,1fr)}.content-grid{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-row{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){
  .app{display:block}.sidebar{position:sticky;top:0;z-index:30;height:auto;padding:12px max(16px,env(safe-area-inset-left,0px));gap:10px;padding-top:max(12px,env(safe-area-inset-top,0px))}
  .brand{padding:0;background:none;justify-content:flex-start}.logo-full{display:none}.logo-icon,.brand-text{display:block}.sidebar .nav-label,.side-bottom{display:none}
  .navs{display:flex;overflow-x:auto;gap:5px}.nav{display:flex;gap:5px}.nav button{white-space:nowrap;padding:8px 10px;font-size:12px;width:auto}.nav .ico{font-size:14px;width:auto}
  .topbar{align-items:flex-start}.topbar h1{font-size:22px}.search{display:none}
  .banner,.vol-hero{align-items:flex-start;flex-direction:column}.banner button,.vol-hero button{width:100%}
  .stats{gap:9px}.stat{padding:13px}.stat h3{font-size:23px}
  .bottom-grid,.management-grid,.form-grid{grid-template-columns:minmax(0,1fr)}.field.full{grid-column:auto}
  main{padding:18px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  .panel{padding:15px}.tracker{grid-template-columns:repeat(2,minmax(0,1fr))}.doc{grid-template-columns:40px minmax(0,1fr)}.doc .acts{grid-column:1/-1;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function startAnalysis(photo,a){const d=S.draft;d.photo=photo;d.analyzing=true;d.a=null;d.confirmed=null;refreshReport();setTimeout(()=>{if(S.draft!==d)return;d.analyzing=false;d.a=a;if(!a.invalid&&!a.unsure){d.cat=a.cat}refreshReport()},1400)}
function submitReport(){
 const d=S.draft,err=$('#reportErr'),desc=$('#fDesc').value.trim();d.cat=$('#fCat').value;
 const problems=[];if(d.a&&d.a.invalid)problems.push('The photo was flagged. Retake it first.');if(!d.cat)problems.push('Choose a category.');if(!d.pin)problems.push('Tap the map to show where it is.');if(!(d.confirmed===true)&&desc.length<4)problems.push('Describe the issue in a few words.');
 if(problems.length){err.innerHTML=`<div class="errbox" style="margin-top:12px"><b class="h">Almost there</b><ul>${problems.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return}
 const t=Date.now(),rid=Date.now()%100000;const r={id:rid,t,who:'me',x:d.pin.x,y:d.pin.y,text:desc||CATS[d.cat].l,photo:d.photo||null,mine:true};
 const near=d.merge&&nearbySame(d.pin,d.cat);S.justAdded.add(rid);
 if(near){const before=lvl(near);near.reports.push(r);near.tl.push([t,`New report added (${near.reports.length} total)`]);const after=lvl(near);if(before!==after)near.tl.push([t,`AI raised priority to ${PRIO[after].l}`]);
  S.lastReport=`Your report joined <b>${near.id}</b> with ${near.reports.length-1} other report${near.reports.length>2?'s':''}. Urgency is now ${scoreOf(near).score}/100 (${PRIO[after].l.toLowerCase()}). Management has been notified.`;toast(`New report linked to <b>${near.id}</b> · now ${near.reports.length} reports`,'',{act:'openProb',id:near.id,label:'Open'})}
 else{const id='P-'+(S.seq++);const p={id,cat:d.cat,label:d.cat==='other'&&desc?desc.replace(/^./,c=>c.toUpperCase()).slice(0,50):null,status:'new',verified:false,reports:[r],tl:[[t,'Report received'],[t,`AI classified it as ${CATS[d.cat].l}`]]};S.problems.unshift(p);
  S.lastReport=`Report <b>${id}</b> received and logged as ${CATS[d.cat].l.toLowerCase()} near ${esc(placeName(d.pin).replace(/^Near /,''))}. MeUchi will link it if neighbours report the same thing.`;toast(`New report <b>${id}</b> in the problems log`,'',{act:'openProb',id,label:'Open'})}
 S.draft=null;render();window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Map ---------- */
PAGES.map=()=>{
 const em=S.emergency?S.emergency.result:null;
 return `<p class="section-desc">Reports are pins coloured by type. AI links reports that share a type and place into one problem (dashed circle) and scores how urgent it is. Run an emergency simulation to see affected buildings and safe routes.</p>

  <div class="mapbox" id="bigMap">${mapSVG({sel:S.sel,em,anim:true})}</div>
  <div class="maphint">${em?'<b>Emergency mode:</b> the hatched area is affected, red crosses are cut roads and dashed lines are routes around them.':'<b>Tip:</b> click a pin or dashed circle to inspect that problem.'}</div>
  <div style="margin-top:10px">${legendHTML()}</div></div></div>
 <div class="panel"><div class="tabs"><button class="${S.mapTab==='problems'?'on':''}" data-act="mapTab" data-v="problems">Problems</button><button class="${S.mapTab==='emergency'?'on':''}" data-act="mapTab" data-v="emergency">Emergency${S.emergency?' ●':''}</button></div>
  ${S.mapTab==='problems'?mapProblems():mapEmergency(em)}</div></div>`;
};
function mapProblems(){
 const o=openP().sort(sortP),multi=o.filter(p=>p.reports.length>=2),single=o.filter(p=>p.reports.length<2);const n=o.reduce((s,p)=>s+p.reports.length,0);
 return `<p style="font-size:18px;margin:0 0 4px"><b>${n}</b> reports <span class="smallmuted">→</span> <b>${o.length}</b> problems</p><p class="smallmuted" style="margin:0 0 12px">Each score is broken down so the team can check it.</p><div class="stack">
 ${multi.map(p=>incCard(p)).join('')}
 ${single.length?`<p class="sh">Single reports <small>not linked to anything yet</small></p>${single.map(p=>incCard(p)).join('')}`:''}</div>`;
}
function incCard(p){const s=scoreOf(p),sel=S.sel===p.id;
 return `<article class="inc sev-${s.level}${sel?' sel':''}" id="card-${p.id}"><button class="inc-head" data-act="selProb" data-id="${p.id}"><span class="row" style="gap:6px"><span class="mono smallmuted">${p.id}</span><span class="tag ${s.level}">${PRIO[s.level].l.toUpperCase()}</span><span class="tag s-${p.status}">${STAT[p.status]}</span>${p.verified?'<span class="tag lowtag">✓ VERIFIED</span>':''}</span><h3>${esc(label(p))}</h3><span class="meta">${esc(placeOf(p))} · ${p_n(p)}</span></button>
 <div class="score"><div class="bar"><i style="width:${s.score}%"></i></div><span class="mono">${s.score}/100</span></div>
 ${sel?`<ul class="factors">${s.factors.map(f=>`<li><span class="mono">+${f[0]}</span><span>${esc(f[1])}</span></li>`).join('')}</ul><details open><summary>Linked reports (${p.reports.length})</summary><ol class="rlist">${p.reports.map(r=>`<li><span class="mono">${rel(r.t)}</span><span>${esc(r.text||'Photo only')}</span></li>`).join('')}</ol></details>`:''}
 <div class="row">${!isMine(p)?`<button class="secondary sm" data-act="meToo" data-id="${p.id}">I see this too</button>`:''}<button class="ghost sm" data-act="openProb" data-id="${p.id}">Open in problems log</button>${p.cat==='drain'?`<button class="danger sm" data-act="escalate" data-id="${p.id}">Escalate to flood emergency</button>`:''}</div></article>`}
function mapEmergency(em){
 if(!em)return `<h3 style="margin:0 0 4px;font-size:16px">No active emergency</h3><p class="smallmuted" style="margin:0 0 12px">Escalate a drain problem, or run a simulation. MeUchi maps the affected area, ranks buildings by who needs help first and routes responders around cut roads.</p><div class="stack">${Object.entries(SCENARIOS).map(([k,s])=>`<button class="scen" data-act="simulate" data-v="${k}"><b>Simulate: ${esc(s.title)}</b><span>${esc(s.note)}</span></button>`).join('')}</div>`;
 return `<div class="stack"><div class="seg">${Object.entries(SCENARIOS).map(([k,s])=>`<button class="${k===em.key?'on':''}" data-act="simulate" data-v="${k}">${s.label}</button>`).join('')}</div>
 <div class="emerg"><span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Emergency mode${S.emergency.from?' · from '+S.emergency.from:' · simulation'}</span><h3>${esc(em.sc.title)}</h3><p>${esc(em.sc.note)}</p></div>
 <div class="mstats"><div><b>${em.affected.length}</b><span>buildings affected</span></div><div><b>~${em.people}</b><span>people at risk now</span></div><div><b>${em.cutE.size}</b><span>road segments cut</span></div></div>
 <p class="sh">Response priorities <small>who needs help first</small></p><ol class="prio">${em.affected.map((a,i)=>`<li class="sev-${a.level}"><span class="rank">${i+1}</span><div><b>${esc(a.b.name)}</b><p>${esc(a.b.type)} · ${Math.round(a.ex*100)}% of site affected${a.b.hours&&!a.open?' · closed now':''}</p><p class="act">${esc(a.action)}</p></div><span class="ppl">~${a.people} ppl</span></li>`).join('')}</ol>
 <p class="sh">Routes <small>avoiding cut roads</small></p>${em.routes.map(r=>r.ok?`<div class="rt"><i class="${r.kind}"></i><div><b>${esc(r.label)}</b><p>${esc(r.fromName)} → ${esc(r.toName)}<br>via ${esc(r.via.join(', '))}</p></div><span class="mono">${(r.meters/1000).toFixed(2)} km<br>~${r.eta} min</span></div>`:`<div class="rt"><i class="${r.kind}"></i><div><b>${esc(r.label)}</b><p>No dry road access from ${esc(r.fromName)} to ${esc(r.toName)}. Boat or 4x4 needed.</p></div><span></span></div>`).join('')}
 ${em.cutRoads.length?`<p class="meta">Closed: ${esc(em.cutRoads.join(', '))}</p>`:''}
 <div class="row"><button class="danger sm" data-act="bomba">Send incident package to BOMBA & police</button>${em.sc.kind!=='block'?'<button class="secondary sm" data-act="evac">Broadcast evacuation notice</button>':''}<button class="ghost sm" data-act="endEm">End emergency</button></div></div>`;
}

 const html=`<p class="section-desc">Notices from management, updates on your reports, and a checker for messages that claim to be from management.</p>
 <div class="issue-list">${S.alerts.map(a=>`<div class="panel alert-card ${a.fresh?'fresh':''}"><div class="alert-icon ${a.kind==='weather'?'blue':''}">${a.icon}</div><div><strong>${esc(a.title)}</strong> ${a.fresh?'<span class="tag">NEW</span>':''}<p>${esc(a.body)}</p><span class="tag ${a.kind==='weather'?'medtag':''}">${a.tag}</span> <span class="smallmuted">· ${rel(a.t)} · ✓ Verified by Management Office</span></div></div>`).join('')}</div>
 <div class="content-grid" style="margin-top:18px">

  ${r?`<div class="stack" style="margin-top:14px"><div class="verdict v-${r.kind}"><div><span class="eyebrow" style="color:var(--muted)">Verdict</span><strong>${r.title}</strong><p>${esc(r.sub)}</p></div><div class="risk"><b>${r.score}</b><span>risk / 100</span></div></div><div class="msgbox">${r.html}</div>
   ${r.flags.length?`<p class="sh">Evidence</p><ul class="evidence">${r.flags.map(f=>`<li><span class="pts">+${f.w}</span><div><b>${esc(f.label)}</b><p>${esc(f.detail)}</p>${f.snippets.length?`<p>Found: ${f.snippets.slice(0,3).map(s=>'<q>'+esc(s)+'</q>').join(', ')}</p>`:''}</div></li>`).join('')}</ul>`:r.verified?`<ul class="evidence"><li><span class="pts okp">✓</span><div><b>Reference ${esc(r.validRef.ref)} found in the register</b><p>Published ${esc(r.validRef.date)}. No payment request, unknown numbers or links.</p></div></li></ul>`:''}
   ${r.notice&&r.rows.length?`<p class="sh">Checked against ${esc(r.notice.ref)} <small>${esc(r.notice.title)}</small></p><div class="cmp-wrap"><table class="cmp"><thead><tr><th></th><th>Official record says</th><th>This message says</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${x.k}</td><td class="good">${esc(x.off)}</td><td class="${x.bad?'bad':'good'}">${esc(x.msg)}</td></tr>`).join('')}</tbody></table></div>`:''}
   ${!r.verified&&r.score>=25?(c.reported?'<p class="ok-line">✓ Reported to management. Thank you for protecting your neighbours.</p>':'<div><button class="danger sm" data-act="scamReport">Report this message to management</button></div>'):''}</div>`:''}
 </div>
 <div class="panel"><div class="panel-head"><div><h2>Updates for you</h2><p>Changes to your reports and application</p></div></div><div class="issue-list">${S.notifs.map(n=>`<div class="issue" ${n.read?'':'style="border-color:var(--green)"'}><div class="issue-symbol" style="background:var(--mint)">🔔</div><div class="issue-main"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><span class="reports">${rel(n.t)}</span></div></div>`).join('')}</div>

 setTimeout(()=>{S.notifs.forEach(n=>n.read=true);S.alerts.forEach(a=>a.seen=true);renderChrome()},400);return html};

const myApp=()=>S.apps.find(a=>a.id===S.user.appId);
PAGES.volunteer=()=>{const v=S.user.vol,app=myApp();
 const locked=v!=='approved';
 const hero={none:['Become an appointed volunteer','Volunteers verify reports and check on vulnerable neighbours. Apply with your documents, and the management office will review and appoint you.','<button data-act="volStart">Apply to volunteer →</button>'],
  pending:['Your application is being reviewed','The management office checks your documents, usually within 2 working days. You will get a notification when they decide.',''],
  info:['Management needs more information','Please update your application so it can be approved.',''],
  approved:['You are an appointed volunteer',`Area: ${esc(app?.area||'')} · appointed ${app?.decidedAt?rel(app.decidedAt):''}. Thank you for looking out for your neighbours.`,'<span class="badge">✦ VOLUNTEER · '+esc(app?.area||'')+'</span>'],
  rejected:['Your application was not approved',esc(app?.reason||''),'<button data-act="volStart">Apply again</button>']}[v];
 let body='';
 if(S.volForm&&(v==='none'||v==='rejected'))body=volForm();
 else if(v==='pending'||v==='info')body=volStatus(app);
 else if(v==='approved')body=volTasks();
 return `<div class="vol-hero"><div><div class="eyebrow" style="color:#d9f16a">Volunteer hub</div><h2>${hero[0]}</h2><p>${hero[1]}</p></div>${S.volForm?'':hero[2]}</div>
 ${body}
 ${locked&&!S.volForm?`<h3 style="font-size:15px;margin:22px 0 10px">What volunteers can do ${v!=='approved'?'<span class="tag grey">🔒 UNLOCKS AFTER APPROVAL</span>':''}</h3><div class="management-grid">
  ${[['📍','Verify nearby reports','Confirm a problem is real so management can act faster. Never enter unsafe areas or confront anyone.'],['♡','Check on vulnerable neighbours','Visit residents who asked to be checked on during floods, outages or blocked roads.'],['🏅','Earn Community Hero points','+15 for each verified report, +20 for each check-in.'],['🤝','Volunteer guidelines','Be respectful, protect personal information and never share unverified accusations.']].map(c=>`<div class="management-card locked"><div style="font-size:26px">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}</div>`:''}`;
};
function docRow(d,doc,mode){const has=!!doc;

 return `<div class="panel"><div class="panel-head"><div><h2>Volunteer application</h2><p>Fields marked <span class="req">*</span> are required. Your documents are only seen by the management office.</p></div><button class="textbtn" data-act="volCancel">Cancel</button></div>

function volStatus(app){const st=app.status;const steps=[['Submitted',true],['Documents checked',Object.values(app.docs).length&&DOCS.filter(d=>d.req).every(d=>app.docs[d.k]?.v)],['Management decision',false],['Appointed',false]];

 ${st==='info'?`<div class="errbox" style="margin-top:14px;border-color:var(--orange);background:#fffaf0;color:#6b4a10"><b class="h" style="color:#a56b16">Message from the management office</b>${esc(app.infoReq)}</div>

 :`<p class="flabel" style="margin:16px 0 6px">Your documents</p><div class="docs">${DOCS.map(d=>docRow(d,app.docs[d.k],'view')).join('')}</div>`}</div>`}
function volTasks(){const q=openP().filter(p=>!p.verified&&!p.vChecked&&!p.reports.every(r=>r.mine));
 return `<div class="content-grid"><div class="panel"><div class="panel-head"><div><h2>Verify reports near you</h2><p>Go and look. Your answer tells management whether the problem is real.</p></div><span class="tag lowtag">+15 EACH</span></div><div class="stack">

  <p class="dh4">Supporting documents</p><div class="docs">${DOCS.map(d=>docRow(d,a.docs[d.k]&&!a.docs[d.k].flag?a.docs[d.k]:null,open?'mgmt':'view')).join('')}</div>

 bomba:()=>toast('Incident package (map, affected buildings, routes) sent to BOMBA and police. Simulated.','red'),
 evac:()=>{const em=S.emergency.result;S.alerts.unshift({id:'AL-'+Date.now(),kind:'scam',icon:'🚨',title:'Evacuation notice: '+em.sc.title,body:`Residents of ${em.affected.slice(0,3).map(a=>a.b.name).join(', ')} should move to the Community Hall relief centre now. Avoid ${em.cutRoads.join(', ')}. Emergency help is free.`,tag:'EVACUATE',t:Date.now(),seen:false,fresh:true});toast('Evacuation notice sent to affected residents.','red');render()},
 meToo:e=>{const p=prob(e.dataset.id),t=Date.now(),src=p.reports[p.reports.length-1];const r={id:t%100000,t,who:'me',x:src.x+(Math.random()*16-8),y:src.y+(Math.random()*16-8),text:'I see this too',photo:p.reports[0].photo,mine:true};S.justAdded.add(r.id);const b=lvl(p);p.reports.push(r);p.tl.push([t,`"Me too" from a resident (${p.reports.length} total)`]);if(b!==lvl(p))p.tl.push([t,`AI raised priority to ${PRIO[lvl(p)].l}`]);toast(`Added. ${p.reports.length} residents have now reported ${p.id}.`);render()},
 sample:e=>startAnalysis(ph(e.dataset.t),ANALYSIS[e.dataset.t]),
 retake:()=>{Object.assign(S.draft,{photo:null,a:null,confirmed:null});refreshReport()},
 aiYes:()=>{S.draft.confirmed=true;S.draft.cat=S.draft.a.cat;refreshReport()},
 aiNo:()=>{S.draft.confirmed=false;refreshReport();setTimeout(()=>$('#fDesc')?.focus(),50)},
 useGps:()=>{S.draft.pin={x:HOME.x+6,y:HOME.y+12};S.draft.merge=true;refreshReport()},
 merge:e=>{S.draft.merge=e.dataset.v==='1';$('#dupBox').innerHTML=dupBox()},
 clearReport:()=>{S.draft=null;S.lastReport=null;render()},
 plFilter:e=>{S.plFilter=e.dataset.v;render()},
 assign:e=>{const p=prob(e.dataset.id),c=matchCon(p),t=Date.now();p.status='assigned';p.contractor=c.id;p.assignedAt=t;p.tl.push([t,`Assigned to ${c.name}`]);if(isMine(p))notify(`${p.id} assigned`,`${c.name} will fix the ${label(p).toLowerCase()} you reported.`);toast(`${esc(c.name)} assigned to <b>${p.id}</b>`);render()},
 progress:e=>{const p=prob(e.dataset.id),t=Date.now();p.status='progress';p.progressAt=t;p.tl.push([t,'Repair started']);if(isMine(p))notify(`${p.id}: repair started`,`Work has started on the ${label(p).toLowerCase()}.`);render()},
 resolve:e=>{const p=prob(e.dataset.id),t=Date.now();p.status='resolved';p.resolvedAt=t;p.tl.push([t,`Resolved with after-photo. ${p.reports.length} resident${p.reports.length>1?'s':''} notified`]);if(isMine(p))notify(`${p.id} resolved`,`The ${label(p).toLowerCase()} near ${placeOf(p).replace(/^Near /,'')} has been fixed.`);toast(`<b>${p.id}</b> resolved. ${p.reports.length} resident${p.reports.length>1?'s':''} notified.`);render()},
 copy:e=>{const v=e.dataset.v;try{navigator.clipboard.writeText(v).then(()=>toast('Copied '+esc(v)),()=>toast('Number: '+esc(v)))}catch(_){toast('Number: '+esc(v))}},
 addCon:()=>{const n=$('#cName').value.trim(),p=$('#cPhone').value.trim();if(!n||!p){toast('Add a company name and phone number first.','red');return}S.contractors.push({id:'c'+Date.now(),name:n,person:$('#cPerson').value.trim(),team:$('#cTeam').value,phone:p});toast(`Added <b>${esc(n)}</b>.`);render()},
 delCon:e=>{S.contractors=S.contractors.filter(c=>c.id!==e.dataset.id);render()},
 scamSample:e=>{S.scam={text:SCAM_SAMPLES[+e.dataset.i],res:scamCheck(SCAM_SAMPLES[+e.dataset.i]),reported:false};render()},
 scamRun:()=>{const t=$('#scamIn').value.trim();if(!t){toast('Paste a message first.','red');return}S.scam={text:t,res:scamCheck(t),reported:false};render()},
 scamReport:()=>{const c=S.scam;c.reported=true;const w=S.waves.find(w=>w.status==='detected'&&scamCheck(w.msg).flags.length&&/rm\s?150|flood repair/i.test(c.text)&&/rm\s?150|flood repair/i.test(w.msg));
  if(w){w.forwards++;toast(`Linked to scam wave <b>${w.id}</b> (${w.forwards} residents)`,'',{act:'go',p:'scam',label:'Review'})}else{const id='SW-0'+(8+S.waves.length);S.waves.unshift({id,title:'Message reported by a resident',status:'detected',first:Date.now(),forwards:1,msg:c.text,warning:'SCAM ALERT: A message going around the township is fake. Do not click links, reply or pay. Call the management office on 03-6000 1234 if unsure.'});toast(`New scam wave <b>${id}</b> for management`,'',{act:'go',p:'scam',label:'Review'})}
  addPoints(25,'Reported a scam message');render()},
 warn:e=>{const w=S.waves.find(x=>x.id===e.dataset.id),t=Date.now();w.status='warned';w.warnedAt=t;S.alerts.forEach(a=>a.fresh=false);S.alerts.unshift({id:'AL-'+t,kind:'scam',icon:'🛡️',title:'Scam alert: '+w.title,body:w.warning,tag:'SCAM ALERT',t,seen:false,fresh:true});toast('Warning sent to <b>1,284 residents</b> in the app and by push notification.','',{act:'go',p:'home',label:'See resident view'});render()},
 dismissWave:e=>{S.waves=S.waves.filter(w=>w.id!==e.dataset.id);toast('Marked as not a scam.');render()},
 /* volunteers */
 volStart:()=>{if(S.user.vol==='rejected'){S.vf={name:S.user.name,phone:'',area:S.user.home,avail:[],skills:[],why:'',docs:{},decl:false}}S.volForm=true;render()},
 volCancel:()=>{S.volForm=false;render()},
 docSample:e=>{const k=e.dataset.k,names={ic:'mykad_izzah.jpg',res:'tnb_bill_sept_2026.pdf',conduct:'police_record_check.pdf',aid:'cpr_certificate.pdf'};setDoc(k,{name:names[k]})},
 docRemove:e=>{const tgt=S.user.vol==='info'?myApp().docs:S.vf.docs;delete tgt[e.dataset.k];refreshDocs()},
 volSubmit:()=>{if(volMissing().length)return;const f=S.vf,t=Date.now(),id='VA-0'+(S.appSeq++);
  S.apps.push({id,name:f.name.trim(),unit:S.user.unit,home:S.user.home,phone:f.phone,area:f.area,avail:f.avail.slice(),skills:f.skills.slice(),why:f.why.trim(),submitted:t,status:'pending',mine:true,docs:Object.fromEntries(Object.entries(f.docs).map(([k,d])=>[k,{...d,v:false}])),tl:[[t,'Application submitted']]});
  S.user.vol='pending';S.user.appId=id;S.volForm=false;notify('Volunteer application sent',`${id} is with the management office for review.`);toast(`Application <b>${id}</b> sent to management`,'',{act:'openApp',id,label:'Review as management'});render()},
 volResubmit:()=>{const a=myApp(),t=Date.now();if(DOCS.filter(d=>d.req).some(d=>!a.docs[d.k]||a.docs[d.k].flag)){toast('Upload all required documents first.','red');return}a.status='pending';a.tl.push([t,'Applicant sent updated documents']);S.user.vol='pending';toast('Updated documents sent to management','',{act:'openApp',id:a.id,label:'Review'});render()},
 openApp:e=>{S.page='applications';S.volForm=false;S.drawer={type:'app',id:e.dataset.id};renderChrome();$('#page').innerHTML=PAGES.applications();renderDrawer(true);window.scrollTo({top:0})},
 docVerify:e=>{const a=S.apps.find(x=>x.id===S.drawer.id),d=a.docs[e.dataset.k];d.v=!d.v;if(d.v)a.tl.push([Date.now(),`${DOCS.find(x=>x.k===e.dataset.k).l.split(' (')[0]} verified`]);render()},
 approve:e=>{const a=S.apps.find(x=>x.id===e.dataset.id),t=Date.now();a.status='approved';a.area=$('#apArea').value;a.decidedAt=t;a.tl.push([t,`Approved and appointed to ${a.area}`]);S.roster.push({name:a.name,area:a.area,since:new Date().toLocaleDateString('en-GB',{month:'short',year:'numeric'}),points:a.mine?S.user.points:0,verified:0});
  if(a.mine){S.user.vol='approved';notify('You are now an appointed volunteer',`The management office approved ${a.id}. Area: ${a.area}. Your volunteer tasks are unlocked.`);addPoints(25,'Appointed as a volunteer')}toast(`<b>${esc(a.name)}</b> appointed as a volunteer for ${esc(a.area)}`,'',a.mine?{act:'go',p:'volunteer',label:'See resident view'}:null);render()},
 reqInfo:e=>{const a=S.apps.find(x=>x.id===e.dataset.id),t=Date.now(),msg=$('#apMsg').value.trim()||'Please upload clearer copies of your documents.';a.status='info';a.infoReq=msg;a.tl.push([t,'More information requested: '+msg]);if(!a.docs.res)a.docs.res=null;if(a.mine){S.user.vol='info';notify('Your volunteer application needs more information',msg)}toast(`Request sent to <b>${esc(a.name)}</b>`,'',a.mine?{act:'go',p:'volunteer',label:'See resident view'}:null);
  if(!a.mine){setTimeout(()=>{if(a.status!=='info')return;a.docs.res={name:'tenancy_agreement_2026.pdf',v:false};a.status='pending';a.tl.push([Date.now(),'Applicant sent updated documents']);toast(`<b>${esc(a.name)}</b> uploaded the missing document`,'',{act:'openApp',id:a.id,label:'Review'});render()},6000)}render()},
 reject:e=>{const a=S.apps.find(x=>x.id===e.dataset.id),t=Date.now(),msg=$('#apMsg').value.trim()||'Your documents could not be verified.';a.status='rejected';a.reason=msg;a.decidedAt=t;a.tl.push([t,'Rejected: '+msg]);if(a.mine){S.user.vol='rejected';notify('Volunteer application not approved',msg)}toast(`Application ${a.id} rejected`);render()},
 vConfirm:e=>{const p=prob(e.dataset.id),t=Date.now();if(e.dataset.v==='1'){p.verified=true;p.verifiedBy='Izzah';p.tl.push([t,'Verified on site by volunteer Izzah']);addPoints(15,'Verified a report');const me=S.roster.find(r=>r.name===myApp()?.name);if(me)me.verified++}else{p.vChecked=true;p.tl.push([t,'Volunteer Izzah could not find the problem on site']);addPoints(10,'Checked a report')}render()},
 checkin:e=>{const n=S.neighbours.find(x=>x.id===e.dataset.id);n.last=Date.now();if(e.dataset.v==='ok'){n.status='ok';addPoints(20,'Checked on '+n.name)}else{n.status='help';toast('Guardhouse alerted. A guard is on the way.','red');addPoints(20,'Checked on '+n.name)}render()}
};
function setDoc(k,doc){if(S.user.vol==='info'){myApp().docs[k]={...doc,v:false}}else{S.vf.docs[k]=doc}refreshDocs()}
function refreshDocs(){const box=$('#docList');if(!box)return;const info=S.user.vol==='info';const src=info?myApp().docs:S.vf.docs;box.innerHTML=DOCS.map(d=>docRow(d,src[d.k]&&!src[d.k].flag?src[d.k]:null,'form')).join('');updVolCheck()}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
 const svgEl=e.target.closest('svg[data-pick]');
 if(svgEl&&S.draft){const pt=svgEl.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svgEl.getScreenCTM().inverse());S.draft.pin={x:Math.round(Math.max(8,Math.min(792,p.x))),y:Math.round(Math.max(8,Math.min(552,p.y)))};S.draft.cat=$('#fCat').value||S.draft.cat;S.draft.merge=true;refreshReport();return}
 const pin=e.target.closest('[data-prob]');
 if(pin){if(e.target.closest('[data-mapclick]')){S.sel=pin.getAttribute('data-prob');S.mapTab='problems';go('map');return}S.sel=pin.getAttribute('data-prob');S.mapTab='problems';render();const c=document.getElementById('card-'+S.sel);if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'});return}
 if(e.target.closest('[data-mapclick]')){go('map');return}
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=A[t.dataset.act];if(f){if(t.tagName!=='LABEL'&&t.tagName!=='INPUT')e.preventDefault();f(t)}
});
document.addEventListener('submit',e=>{if(e.target.id==='reportForm'){e.preventDefault();submitReport()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='photoIn'&&t.files&&t.files[0]){const f=t.files[0],rd=new FileReader();rd.onload=()=>startAnalysis({type:'upload',src:rd.result},guessFromName(f.name));rd.readAsDataURL(f)}
 if(t.id==='fCat'&&S.draft){S.draft.cat=t.value;S.draft.merge=true;$('#dupBox').innerHTML=dupBox()}
 if(t.dataset.doc&&t.files&&t.files[0]){const f=t.files[0],k=t.dataset.doc;if(f.type.startsWith('image/')){const rd=new FileReader();rd.onload=()=>setDoc(k,{name:f.name,src:rd.result});rd.readAsDataURL(f)}else setDoc(k,{name:f.name})}
 if(t.dataset.vfa){const arr=S.vf[t.dataset.vfa];if(t.checked){if(!arr.includes(t.value))arr.push(t.value)}else S.vf[t.dataset.vfa]=arr.filter(x=>x!==t.value)}
 if(t.dataset.vf==='decl'){S.vf.decl=t.checked;updVolCheck()}
 if(t.dataset.vf==='area'){S.vf.area=t.value}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.vf&&t.dataset.vf!=='decl'&&t.dataset.vf!=='area'){S.vf[t.dataset.vf]=t.value;updVolCheck()}
 if(t.id==='scamIn')S.scam.text=t.value;
 if(t.dataset.wid){S.waves.find(w=>w.id===t.dataset.wid).warning=t.value}
 if(t.id==='globalSearch'){S.search=t.value;if(S.page!=='home')go('home');else{$('#page').innerHTML=PAGES.home()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.drawer){S.drawer=null;renderDrawer()}});
setInterval(()=>{if(S.page==='home'||S.page==='problems')renderChrome()},30000);

S=seed();render();
})();
</script>

</body>
</html>
